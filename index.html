<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFT Class Photo Tool</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.10.0/dist/ethers.umd.min.js"></script>
  <style>
    body { font-family: Arial; margin:0; background:#111; color:#fff; }
    .container { padding:20px; text-align:center; }
    button { padding:10px 20px; margin:10px; cursor:pointer; border-radius:10px; }
    #overlay {
      position:fixed; inset:0; display:none; justify-content:center; align-items:center;
      background:rgba(0,0,0,0.8); backdrop-filter: blur(6px);
      z-index:999;
    }
    #overlayContent {
      position:relative;
      width:400px;
      max-width:90%;
    }
    #overlayContent img.main {
      width:100%; border-radius:20px;
    }
    #hud {
      position:absolute; inset:0;
      background-image:url('https://ipfs.io/ipfs/bafybeifmgmf2iec3htvgt3lqy6fghf5zfe76ews3invh2a4qclnbondwsq');
      background-size:cover; pointer-events:none;
      border-radius:20px;
    }
    #carousel {
      display:flex; overflow-x:auto; gap:10px; margin-top:15px;
      justify-content:center;
    }
    #carousel img {
      width:70px; height:70px; object-fit:cover;
      border-radius:10px; cursor:pointer; opacity:0.6;
    }
    #carousel img.active { opacity:1; border:2px solid #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>NFT Class Photo</h1>
    <button id="connectBtn">Connect Wallet</button>
    <button id="verifyBtn">Verify NFTs</button>
    <button id="photoBtn" disabled>Take Class Photo</button>
  </div>

  <div id="overlay">
    <div id="overlayContent">
      <img class="main" id="mainImage" src="" />
      <div id="hud"></div>
      <div id="carousel"></div>
    </div>
  </div>

<script>
const CONTRACT = "0x40941ee94980e0fc623311b31c20fbae56673d81";
let provider, signer, userAddress;
let nfts = [];
let selectedIndex = 0;

async function connectWallet() {
  if (!window.ethereum) return alert("Install MetaMask");
  provider = new ethers.BrowserProvider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  signer = await provider.getSigner();
  userAddress = await signer.getAddress();
  alert("Connected: " + userAddress);
}

async function fetchNFTs() {
  // NOTE: Replace with your own backend or exposed env proxy if needed
  const url = `https://api.opensea.io/api/v2/chain/ethereum/account/${userAddress}/nfts?collection=${CONTRACT}`;

  const res = await fetch(url, {
    headers: {
      "X-API-KEY": "YOUR_API_KEY_HERE"
    }
  });

  const data = await res.json();
  nfts = (data.nfts || []).map(n => ({
    image: n.image_url || n.display_image_url,
    name: n.name
  })).filter(n => n.image);

  if (nfts.length === 0) {
    alert("No NFTs found from collection");
    return;
  }

  document.getElementById("photoBtn").disabled = false;
  buildCarousel();
}

function buildCarousel() {
  const carousel = document.getElementById("carousel");
  carousel.innerHTML = "";

  nfts.forEach((nft, i) => {
    const img = document.createElement("img");
    img.src = nft.image;
    if (i === 0) img.classList.add("active");

    img.onclick = () => {
      selectedIndex = i;
      updateMain();
      document.querySelectorAll("#carousel img").forEach(el => el.classList.remove("active"));
      img.classList.add("active");
    };

    carousel.appendChild(img);
  });

  updateMain();
}

function updateMain() {
  document.getElementById("mainImage").src = nfts[selectedIndex].image;
}

function openOverlay() {
  document.getElementById("overlay").style.display = "flex";
}

// Events

document.getElementById("connectBtn").onclick = connectWallet;
document.getElementById("verifyBtn").onclick = fetchNFTs;
document.getElementById("photoBtn").onclick = openOverlay;
</script>
</body>
</html>
